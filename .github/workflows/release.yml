name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches plugin.cfg version
        run: |
          CFG_VERSION="v$(grep '^version=' addons/godot_mcp_toolkit/plugin.cfg | cut -d'"' -f2)"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$CFG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match plugin.cfg version $CFG_VERSION"
            exit 1
          fi
          echo "Version validated: $TAG"

      - name: Build plugin zip
        run: bash scripts/build-plugin-release.sh

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-plugin/godot-mcp-toolkit-*.zip

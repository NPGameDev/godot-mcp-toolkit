name: Release

# Release path — gated on the deep behavioral tier and the floor, and read-only.
#
# This workflow builds and checks the release's files and uploads them as a workflow
# artifact. It never creates or edits a GitHub Release: the maintainer drafts, signs
# and publishes the release from their own machine (scripts/publish-release.sh),
# starting from the artifact of the tag's run.
#
# Two entry points, running the same jobs:
#   • v* tag push       → the behavioral matrix and the full floor (ci.yml with the
#                         macOS apply-kill rows) run first (via workflow_call), then
#                         the zip and its update manifest are built, install-smoked,
#                         checked against the tagged tree and uploaded as the
#                         artifact release-<tag>.
#   • workflow_dispatch → from a branch, a dry run: the same path without the checks
#                         that need a tag (the tag against plugin.cfg, the CHANGELOG
#                         and the server pin), with the commit standing in for the
#                         tag. Makes the whole release path testable before a tag
#                         exists. Dispatching ON a tag ref runs everything the tag
#                         push runs: the manual re-run escape hatch after a
#                         transient tag-push failure.
#
# ⚠ Called-workflow gate caveat: the behavioral callee evaluates github.ref /
# event_name from THIS (caller) context — a v* tag push satisfies its
# startsWith(github.ref,'refs/tags/v') gates; a dispatch satisfies its
# event_name=='workflow_dispatch' gates. If release.yml ever gains a NEW trigger type
# (e.g. schedule), the callee's opt-in jobs would all-skip and the behavioral: call
# would succeed VACUOUSLY, un-gating the release — re-verify the callee gates whenever
# the release triggers change. The floor callee has no such gate: its changes job
# reports code on every event but a pull request.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A dispatch on a tag ref must never race that tag's still-running run, and a later
# run must never cancel one in progress — so cancel-in-progress is false.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege for the whole workflow: no job re-grants a write, so no run can
# create or change a release, a tag or a branch. Uploading a workflow artifact needs
# no repository permission.
permissions:
  contents: read

jobs:
  # Gate the release on the full cross-version behavioral matrix (6 GDScript +
  # 6 .NET/mono behavioral + 2 mono-units). The callee's own workflow-level
  # SIBLING_PIN_SERVER env resolves normally under workflow_call, and
  # inputs.sibling-ref is empty when called -> the pin holds.
  # Bump the pin to the certified sibling revision BEFORE tagging (ritual unchanged).
  behavioral:
    uses: ./.github/workflows/cross-version.yml

  # The release also waits on the whole floor (ci.yml), with the apply-kill legs on macOS
  # for every version; pull requests run macOS on 4.7 only. The floor's changes job reports
  # code for this workflow's tag push and dispatch, so no floor job skips here.
  floor:
    uses: ./.github/workflows/ci.yml
    with:
      macos-kill: true

  build-and-upload:
    needs: [behavioral, floor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A dispatch from a branch has ref_type 'branch' and no tag to compare, so this
      # check would spuriously fail — skip it off a tag. The sibling-pin steps below
      # carry the same tag guard.
      - name: Validate tag matches plugin.cfg version
        if: github.ref_type == 'tag'
        run: |
          CFG_VERSION="v$(grep '^version=' addons/godot_mcp_toolkit/plugin.cfg | cut -d'"' -f2)"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$CFG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match plugin.cfg version $CFG_VERSION"
            exit 1
          fi
          VER="${TAG#v}"
          # CHANGELOG must carry a section for the tagged version.
          if ! grep -qF "## [$VER]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section for the tagged release."
            exit 1
          fi
          echo "Version validated: $TAG"

      # Check out the pinned server sibling so its DECLARED version can be asserted
      # against the tag. Mirrors the sibling-checkout idiom cross-version.yml uses.
      # Reads the pin from cross-version.yml so there is one source of truth for
      # SIBLING_PIN_SERVER.
      - name: Check out pinned server sibling
        if: github.ref_type == 'tag'
        run: |
          PIN="$(grep 'SIBLING_PIN_SERVER:' .github/workflows/cross-version.yml | sed -E 's/.*"([0-9a-f]+)".*/\1/')"
          echo "SIBLING_PIN_SERVER=$PIN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag'
        with:
          repository: NPGameDev/godot-mcp-server
          path: server-pin
          ref: ${{ env.SIBLING_PIN_SERVER }}
          token: ${{ github.token }}

      # The pinned server sibling's DECLARED version must equal the tag — makes the
      # bump-before-tag pin ritual machine-checked (a stale pin = green tests of the
      # WRONG pairing).
      - name: Pinned sibling declared version matches the tag
        if: github.ref_type == 'tag'
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          SV_PKG="$(node -p "require('./server-pin/package.json').version")"
          if [ -z "$SV_PKG" ]; then
            echo "::error::Could not read the pinned server package.json version at $SIBLING_PIN_SERVER."
            exit 1
          fi
          if [ "$SV_PKG" != "$VER" ]; then
            echo "::error::Pinned server ($SIBLING_PIN_SERVER) declares version $SV_PKG, tag is $VER — bump SIBLING_PIN_SERVER before tagging."
            exit 1
          fi
          echo "Pinned server declared version matches: $VER"

      - name: Build plugin zip
        run: bash scripts/build-plugin-release.sh

      # Zip install-smoke (on a dry run too; that's the point): prove the
      # artifact we are about to ship actually INSTALLS and BOOTS, not just that it
      # zipped. Unzip the built artifact into a scratch project (minimal
      # project.godot with the plugin pre-enabled — the same shape as the server's
      # C# fixture, proven to boot fresh on CI), launch a headless 4.7.0 editor via
      # the composite's launch/poll-6550 idiom, and assert the plugin's WS server
      # comes up ("[MCPServer] listening" in the editor log + the port serving).
      - name: Setup Godot 4.7.0 (zip install-smoke)
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Zip install-smoke (GDScript editor · Godot 4.7.0)
        # Step-level fuse: the poll loop is bounded (<=60s) but a wedged unzip/boot
        # should fail the STEP (letting the always() log step below run), not hang
        # the job.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          SCRATCH="$RUNNER_TEMP/zip-install-smoke"
          mkdir -p "$SCRATCH"
          unzip -q dist-plugin/godot-mcp-toolkit-*.zip -d "$SCRATCH"
          test -f "$SCRATCH/addons/godot_mcp_toolkit/plugin.cfg" || {
            echo "::error::zip layout broken: addons/godot_mcp_toolkit/plugin.cfg missing after unzip."
            exit 1
          }
          cat > "$SCRATCH/project.godot" <<'EOF'
          config_version=5

          [application]

          config/name="Zip Install Smoke"
          config/features=PackedStringArray("4.7")

          [editor_plugins]

          enabled=PackedStringArray("res://addons/godot_mcp_toolkit/plugin.cfg")
          EOF
          godot --headless --editor --path "$SCRATCH" > zip-smoke-editor.log 2>&1 &
          EDITOR_PID=$!
          up=0
          for i in $(seq 1 60); do
            if node -e 'const n=require("net");const s=n.connect(6550,"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1))'; then
              up=1
              break
            fi
            sleep 1
          done
          kill "$EDITOR_PID" 2>/dev/null || true
          if [ "$up" != "1" ]; then
            echo "::error::zip install-smoke: port 6550 never came up within 60s."
            exit 1
          fi
          grep -F "[MCPServer] listening on" zip-smoke-editor.log || {
            echo "::error::zip install-smoke: '[MCPServer] listening on' not found in the editor log."
            exit 1
          }
          echo "Zip install-smoke OK: plugin enabled and WS server listening."

      - name: Zip install-smoke editor log (always)
        if: always()
        run: cat zip-smoke-editor.log 2>/dev/null || true

      # The tree the smoke just booted, against the zip's file list and the manifest:
      # a changed file, a file the plugin or the engine wrote into the addon folder, or
      # a manifest that does not describe the zip stops the release here. The smoke stops
      # the editor as soon as the port is up, and the engine creates plugins before its
      # full scan, which is what mints a missing .uid. --import runs until that scan ends.
      - name: Verify release files
        timeout-minutes: 5
        run: |
          godot --headless --import --path "$RUNNER_TEMP/zip-install-smoke"
          bash scripts/check_release_files.sh \
            dist-plugin/godot-mcp-toolkit-*.zip \
            dist-plugin/godot-mcp-toolkit-*.update.json \
            "$RUNNER_TEMP/zip-install-smoke/addons/godot_mcp_toolkit"

      # Update-smoke: the zip and manifest just built install over the previous
      # version through the toolkit's self-update, signed with a key made for the
      # run (this workflow does not sign the release's own manifest).
      - name: Update-smoke (self-update · Godot 4.7.0)
        timeout-minutes: 10
        env:
          UPDATE_FLOW_LEGS: full
          UPDATE_FLOW_SKIP_BUILD: "1"
        run: bash scripts/test_framework/update_flow.sh godot

      # What the two steps below share. On a tag ref the artifact is release-<tag>,
      # the name scripts/publish-release.sh downloads. A dispatch from a branch has no
      # tag, so the commit stands in for it, both in the artifact's name and as the
      # revision the zip is checked against: a dry run then runs both steps too.
      - name: Name the release files
        run: |
          VERSION="$(grep '^version=' addons/godot_mcp_toolkit/plugin.cfg | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            REVISION="$GITHUB_REF_NAME"
            ARTIFACT="release-$GITHUB_REF_NAME"
          else
            REVISION="$GITHUB_SHA"
            ARTIFACT="release-untagged-$GITHUB_SHA"
          fi
          {
            echo "RELEASE_ZIP=dist-plugin/godot-mcp-toolkit-$VERSION.zip"
            echo "RELEASE_MANIFEST=dist-plugin/godot-mcp-toolkit-$VERSION.update.json"
            echo "RELEASE_REVISION=$REVISION"
            echo "RELEASE_ARTIFACT=$ARTIFACT"
          } >> "$GITHUB_ENV"

      # The zip against the committed tree at the revision, so a zip that differs from
      # what the tag holds fails here. An early warning only: the run that decides is
      # the same check on the maintainer's machine, on the downloaded artifact.
      - name: Check the zip against the tree
        run: |
          test -f "$RELEASE_MANIFEST" || {
            echo "::error::$RELEASE_MANIFEST is missing; the artifact needs the zip and its manifest."
            exit 1
          }
          node scripts/check-release-zip.mjs "$RELEASE_ZIP" "$RELEASE_REVISION"

      # The zip and its unsigned manifest, by exact name so the artifact holds those two
      # files and nothing else.
      - name: Upload the release files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_MANIFEST }}
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub fires merge_group against the temporary
  # refs/heads/gh-readonly-queue/... branch once a PR is enqueued, and blocks the merge
  # on the required checks that report there. RETAINED but INERT — merge queues require
  # an ORGANIZATION-owned repository and this one is user-owned, so the event never
  # fires; the live gate is the pull_request run above. Kept because it costs nothing
  # and the floor needs no edits the day the repo moves to an org: no job below is gated
  # on an event name or a commit-message token, so every one of them runs on every
  # trigger this workflow accepts, and the aggregate can never pass vacuously. The
  # gh-readonly-queue ref does not match the push filter above, so a queued PR would
  # produce ONE floor run, not two.
  merge_group:

# D7 (going-public supply-chain baseline): least privilege by default. No floor job
# writes repo contents; the release path grants its own contents: write per-job.
permissions:
  contents: read

# D6: cancel an in-flight floor run when a newer commit lands on the same ref — the
# floor gates the tip, so a superseded run's result is moot. NOT on cross-version.yml:
# those deep-tier runs are cancelled only for a pull request, where superseding is the
# point (see that workflow's own concurrency block). Keying the group on github.ref is
# what makes this correct for a PR gate: each PR has its own refs/pull/N/merge, so a
# fixup push supersedes only that PR's floor run — and a merge-queue entry, were this
# repo ever org-owned, would land in a group of its own rather than cancelling the
# required check out from under the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdscript-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # D1: trimmed 5 rows -> the 2 boundaries. Middle-version (4.4-4.6) parse
          # regressions are near-nil, and a redundant row on a merge gate still
          # fails for FAKE reasons (runner/download flakes); breadth lives in the
          # deep tier, whose editor boot re-compiles the full preload graph on all
          # six versions per opt-in run. Boundaries kept:
          #   • 4.3.0 — the analyzer floor. 4.2 is excluded IN PRINCIPLE, not
          #     trimmed: its pre-4.3 analyzer emits spurious cross-file class_name
          #     errors during the scan itself (analyzer limitation, not cold
          #     cache), so static validation cannot run there — 4.2's floor
          #     signal is the unit-tests job below (which warms the class cache
          #     and runs the suite). See CLAUDE.md and COMPATIBILITY.md.
          #   • 4.7.0 — the ceiling.
          - godot-version: "4.3.0"
          - godot-version: "4.7.0"
    name: "Static validation (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # Centralized validation: editor-headless + per-file script runner.
      # Replaces the split --check-only / editor paths. --check-only was a
      # no-op without --script (engine source audit, 2026-05-27).
      - name: GDScript validation
        run: bash scripts/test_framework/validate_gdscript.sh

      # Docs-drift gate: README headline numbers match the pinned tool-surface
      # counts and no retired vocabulary appears in user-facing docs
      # (grep-only, no Godot).
      - name: Docs count check
        run: bash scripts/check_docs_counts.sh

  # Unit-execution leg — a real execution signal across ALL supported versions
  # (standard editor, gating). Generalized from the former 4.2-only job
  # (41n-quater-ter): the godot-units composite runs run_units_cold.sh, whose
  # class-cache warm-up is required on 4.2 (its editor scan aborts on cross-file
  # class_name refs before it completes, fixed in 4.3) and idempotent on 4.3+,
  # so the identical script runs on every version. This is where 4.3-4.7 units
  # run too (moved out of gdscript-check to avoid a double run). Merge gate.
  unit-tests:
    runs-on: ubuntu-latest
    # Fuse: a leg finishes in a few minutes — at 10 min it is hung, not slow.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Unit tests (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-units
        with:
          godot-version: ${{ matrix.godot-version }}
          use-dotnet: false

  # ── Manifest-diff regression (41n-quinquies) ─────────────────────────────────
  # Lightweight, editor-free drift gate: per supported version, dump the REAL
  # engine surface (`godot --headless --dump-extension-api`) and assert the
  # committed distilled compat map's CLASS column for that version still matches
  # it — failing if the engine surface drifts (a class added/removed) without a
  # compat-map regen. The map is the harness's committed SSOT
  # (Validations/cross-version-audit/compat-map.json, built by scripts/run_all.sh);
  # this floor job only re-checks its class backbone. The deep member/signature
  # diff logic is NOT reinvented here — it stays in the local harness
  # (build_compat_map.py + `FORCE=1 bash run_all.sh`), the remediation path a red
  # leg points at. Editor-free (a pure C++ ClassDB dump, no editor scan / no WS
  # round-trip), so it belongs in this floor rather than the spike-gated behavioral
  # cross-version.yml. Class presence is patch-invariant (Godot patch releases do
  # not change ClassDB), so the repo-standard X.Y.0 matrix is safe even though the
  # map's 4.4/4.6 columns were distilled from 4.4.1/4.6.2 (compat-map meta.editor_builds).
  manifest-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Manifest diff (extension_api · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # `--dump-extension-api` serializes ClassDB to ./extension_api.json. It is
      # analyzer-free (a pure C++ dump — no GDScript scan), so 4.2 is INCLUDED here
      # even though the editor-scan floor (gdscript-check) excludes it.
      - name: Dump extension_api.json (headless)
        run: godot --headless --dump-extension-api

      # Reuse the committed compat map as SSOT; compare its version-N class column
      # to the freshly dumped surface (pure set equality — not a diff-logic reimpl).
      - name: Verify compat-map class column matches the real surface
        shell: bash
        env:
          MATRIX_VERSION: ${{ matrix.godot-version }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          VERSIONS = ["4.2", "4.3", "4.4", "4.5", "4.6", "4.7"]
          mm = ".".join(os.environ["MATRIX_VERSION"].split(".")[:2])
          vi = VERSIONS.index(mm)
          cmap = json.load(open("Validations/cross-version-audit/compat-map.json", encoding="utf-8"))
          dump = json.load(open("extension_api.json", encoding="utf-8"))
          expected = {n for n, r in cmap["classes"].items() if r["present"][vi] == "Y"}
          actual = {c["name"] for c in dump.get("classes", [])}
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          for sym in missing: print("  MAP-claims-present ENGINE-missing: " + sym)
          for sym in extra: print("  ENGINE-exposes MAP-not-present: " + sym)
          if missing or extra:
              print("::error::compat-map class drift for Godot %s: %d in map-not-engine, %d in engine-not-map. Regenerate: cd Validations/cross-version-audit/scripts && FORCE=1 bash run_all.sh" % (mm, len(missing), len(extra)))
              sys.exit(1)
          print("OK: Godot %s class surface matches the compat-map column (%d classes)." % (mm, len(expected)))
          PY

  # ── Aggregate floor gate (D8) ────────────────────────────────────────────────
  # "Toolkit floor OK" is the SINGLE name bound as a required check for pull requests
  # (and on the protected branch) — never an individual matrix row. A required
  # check pinned to a matrix leg breaks whenever the matrix is retuned (D1 just did);
  # pinning to this one stable name never does. Every job in needs: runs
  # unconditionally on every trigger this workflow accepts, merge_group included, so
  # the gate is always substantive: an all-skip, which WOULD pass vacuously here, is
  # structurally impossible. `if: always()` + the explicit failure/cancelled test also
  # makes future path-filtered docs-skips safe: an `if:`-skipped upstream reports
  # success here, whereas a `paths:`-skipped required check would deadlock as pending.
  floor-ok:
    name: "Toolkit floor OK"
    needs: [gdscript-check, unit-tests, manifest-diff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every floor job succeeded
        run: |
          result="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$result" = "true" ]; then
            echo "::error::A toolkit floor job failed or was cancelled."
            exit 1
          fi
          echo "All toolkit floor jobs succeeded."

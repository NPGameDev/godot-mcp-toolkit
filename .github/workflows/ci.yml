name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.2 standard build: editor scan aborts on class_name cross-refs
          # (chicken-and-egg in GDScript module, fixed in 4.3). Use the .NET
          # build instead — its initialization path may resolve the class
          # cache differently. If this still fails, remove 4.2 from the
          # matrix entirely (4.2 validated via local sweep+smoke instead).
          - godot-version: "4.2.0"
            use-dotnet: true
            skip-unit-tests: true  # class cache may still not generate for --script mode
          - godot-version: "4.3.0"
          - godot-version: "4.4.0"
          - godot-version: "4.5.0"
          - godot-version: "4.6.2"
    name: GDScript check (Godot ${{ matrix.godot-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: ${{ matrix.use-dotnet || false }}

      # Centralized validation: editor-headless + per-file script runner.
      # Replaces the split --check-only / editor paths. --check-only was a
      # no-op without --script (engine source audit, 2026-05-27).
      - name: GDScript validation
        run: bash scripts/test_framework/validate_gdscript.sh

      # Editor-headless (Pass 1) generates global_script_class_cache.cfg
      # as a side effect, so no separate cache step is needed.
      - name: Run unit tests
        if: ${{ !matrix.skip-unit-tests }}
        run: timeout 30 godot --headless --script test/run_unit_tests.gd

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdscript-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.2 excluded from THIS static-validation matrix: its editor scan
          # aborts on class_name cross-refs (chicken-and-egg in the GDScript
          # module, fixed in 4.3; both standard and .NET builds share it). 4.2
          # still gets an execution signal from the unit-tests-4-2 job below,
          # which warms the class cache and runs the unit suite. See CLAUDE.md
          # and COMPATIBILITY.md.
          - godot-version: "4.3.0"
          - godot-version: "4.4.0"
          - godot-version: "4.5.0"
          - godot-version: "4.6.2"
          - godot-version: "4.7.0"
    name: GDScript check (Godot ${{ matrix.godot-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # Centralized validation: editor-headless + per-file script runner.
      # Replaces the split --check-only / editor paths. --check-only was a
      # no-op without --script (engine source audit, 2026-05-27).
      - name: GDScript validation
        run: bash scripts/test_framework/validate_gdscript.sh

      # Editor-headless (Pass 1) generates global_script_class_cache.cfg
      # as a side effect, so no separate cache step is needed.
      - name: Run unit tests
        if: ${{ !matrix.skip-unit-tests }}
        run: timeout 30 godot --headless --script test/run_unit_tests.gd

  # Godot 4.2 unit-execution leg. 4.2 can't run the editor-headless static
  # validator above (its scan aborts on cross-file class_name refs), so this
  # job warms the class cache with two --import passes and runs the unit suite
  # instead — the 4.2 execution signal at the support floor. Merge gate.
  unit-tests-4-2:
    runs-on: ubuntu-latest
    name: Unit tests (Godot 4.2)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-4.2-units


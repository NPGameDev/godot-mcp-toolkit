name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub fires merge_group against the temporary
  # refs/heads/gh-readonly-queue/... branch once a PR is enqueued, and blocks the merge
  # on the required checks that report there. RETAINED but INERT — merge queues require
  # an ORGANIZATION-owned repository and this one is user-owned, so the event never
  # fires; the live gate is the pull_request run above. Kept because it costs nothing
  # and the floor needs no edits the day the repo moves to an org: the only skip below
  # is the docs-only pull request (.github/actions/changes), and a merge-queue run never
  # classifies as docs-only, so every job runs on it and the aggregate can never pass
  # vacuously. The gh-readonly-queue ref does not match the push filter above, so a
  # queued PR would produce ONE floor run, not two.
  merge_group:

# Supply-chain baseline: least privilege by default. No floor job
# writes repo contents; the release path grants its own contents: write per-job.
permissions:
  contents: read

# Cancel an in-flight floor run when a newer commit lands on the same ref — the
# floor gates the tip, so a superseded run's result is moot. NOT on cross-version.yml:
# those deep-tier runs are cancelled only for a pull request, where superseding is the
# point (see that workflow's own concurrency block). Keying the group on github.ref is
# what makes this correct for a PR gate: each PR has its own refs/pull/N/merge, so a
# fixup push supersedes only that PR's floor run — and a merge-queue entry, were this
# repo ever org-owned, would land in a group of its own rather than cancelling the
# required check out from under the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes *.md files skips every job that
  # provisions Godot; docs-check below still runs on it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: classify
        uses: ./.github/actions/changes

  # Editor-free checks that also cover docs-only pull requests.
  docs-check:
    runs-on: ubuntu-latest
    name: "Docs and script checks (no Godot)"
    steps:
      - uses: actions/checkout@v7

      # Docs-drift gate: README headline numbers match the pinned tool-surface
      # counts and no retired vocabulary appears in user-facing docs
      # (grep-only, no Godot).
      - name: Docs count check
        run: bash scripts/check_docs_counts.sh

      # The server-pin helpers release.sh uses, against temp copies and a stubbed
      # npm (no Godot, no network).
      - name: Compatible-server script test
        run: bash scripts/test_compatible_server.sh

  gdscript-check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the 2 boundary versions run here. Middle-version (4.4-4.6) parse
          # regressions are near-nil, and a redundant row on a merge gate still
          # fails for FAKE reasons (runner/download flakes); breadth lives in the
          # deep tier, whose editor boot re-compiles the full preload graph on all
          # six versions per opt-in run. Boundaries kept:
          #   • 4.3.0 — the analyzer floor. 4.2 is excluded IN PRINCIPLE, not
          #     trimmed: its pre-4.3 analyzer emits spurious cross-file class_name
          #     errors during the scan itself (analyzer limitation, not cold
          #     cache), so static validation cannot run there — 4.2's floor
          #     signal is the unit-tests job below (which warms the class cache
          #     and runs the suite). See CLAUDE.md and COMPATIBILITY.md.
          #   • 4.7.0 — the ceiling.
          - godot-version: "4.3.0"
          - godot-version: "4.7.0"
    name: "Static validation (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # Centralized validation: editor-headless + per-file script runner.
      # Replaces the split --check-only / editor paths. --check-only was a
      # no-op without --script (engine source audit, 2026-05-27).
      - name: GDScript validation
        run: bash scripts/test_framework/validate_gdscript.sh

  # Unit-execution leg — a real execution signal across ALL supported versions
  # (standard editor, gating). The godot-units composite runs run_units_cold.sh, whose
  # class-cache warm-up is required on 4.2 (its editor scan aborts on cross-file
  # class_name refs before it completes, fixed in 4.3) and idempotent on 4.3+,
  # so the identical script runs on every version. This is where 4.3-4.7 units
  # run too (moved out of gdscript-check to avoid a double run). Merge gate.
  unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Fuse: a leg finishes in a few minutes — at 10 min it is hung, not slow.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Unit tests (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-units
        with:
          godot-version: ${{ matrix.godot-version }}
          use-dotnet: false

  # ── Self-update flow ─────────────────────────────────────────────────────────
  # The toolkit's self-update end to end, on scratch projects (update_flow.sh): the
  # release this tree builds installs over the previous version at an editor's exit,
  # a failed write rolls back, an untrusted signature and the repository guard stage
  # nothing, and a disable installs nothing. Headless with the contributor-only
  # GODOT_MCP_UPDATE_ALLOW_HEADLESS, against a local server in place of GitHub. The
  # floor's two boundaries: 4.2 frees plugins at exit differently from 4.3+.
  update-flow:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Fuse: the five legs take a few minutes — at 15 min a boot is hung.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.7.0"]
    name: "Update flow (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Run the update flow
        run: bash scripts/test_framework/update_flow.sh godot

  # ── Release builds agree ─────────────────────────────────────────────────────
  # The bash and PowerShell release builds write the same release: the same zip
  # entries with the same bytes, the same release file list, and manifests that
  # agree on all but the zip's own size and hash (check_release_builds.sh). Editor-
  # free; the runner's PowerShell 7 runs the .ps1 the maintainer may build with.
  release-builds:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Release builds agree (bash · PowerShell)"
    steps:
      - uses: actions/checkout@v7

      - name: Compare the two release builds
        run: bash scripts/test_framework/check_release_builds.sh

  # ── Manifest-diff regression ─────────────────────────────────────────────────
  # Lightweight, editor-free drift gate: per supported version, dump the REAL
  # engine surface (`godot --headless --dump-extension-api`) and assert the
  # committed distilled compat map's CLASS column for that version still matches
  # it — failing if the engine surface drifts (a class added/removed) without a
  # compat-map regen. The map is the harness's committed SSOT
  # (Validations/cross-version-audit/compat-map.json, built by scripts/run_all.sh);
  # this floor job only re-checks its class backbone. The deep member/signature
  # diff logic is NOT reinvented here — it stays in the local harness
  # (build_compat_map.py + `FORCE=1 bash run_all.sh`), the remediation path a red
  # leg points at. Editor-free (a pure C++ ClassDB dump, no editor scan / no WS
  # round-trip), so it belongs in this floor rather than the spike-gated behavioral
  # cross-version.yml. Class presence is patch-invariant (Godot patch releases do
  # not change ClassDB), so the repo-standard X.Y.0 matrix is safe even though the
  # map's 4.4/4.6 columns were distilled from 4.4.1/4.6.2 (compat-map meta.editor_builds).
  manifest-diff:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Manifest diff (extension_api · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # `--dump-extension-api` serializes ClassDB to ./extension_api.json. It is
      # analyzer-free (a pure C++ dump — no GDScript scan), so 4.2 is INCLUDED here
      # even though the editor-scan floor (gdscript-check) excludes it.
      - name: Dump extension_api.json (headless)
        run: godot --headless --dump-extension-api

      # Reuse the committed compat map as SSOT; compare its version-N class column
      # to the freshly dumped surface (pure set equality — not a diff-logic reimpl).
      - name: Verify compat-map class column matches the real surface
        shell: bash
        env:
          MATRIX_VERSION: ${{ matrix.godot-version }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          VERSIONS = ["4.2", "4.3", "4.4", "4.5", "4.6", "4.7"]
          mm = ".".join(os.environ["MATRIX_VERSION"].split(".")[:2])
          vi = VERSIONS.index(mm)
          cmap = json.load(open("Validations/cross-version-audit/compat-map.json", encoding="utf-8"))
          dump = json.load(open("extension_api.json", encoding="utf-8"))
          expected = {n for n, r in cmap["classes"].items() if r["present"][vi] == "Y"}
          actual = {c["name"] for c in dump.get("classes", [])}
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          for sym in missing: print("  MAP-claims-present ENGINE-missing: " + sym)
          for sym in extra: print("  ENGINE-exposes MAP-not-present: " + sym)
          if missing or extra:
              print("::error::compat-map class drift for Godot %s: %d in map-not-engine, %d in engine-not-map. Regenerate: cd Validations/cross-version-audit/scripts && FORCE=1 bash run_all.sh" % (mm, len(missing), len(extra)))
              sys.exit(1)
          print("OK: Godot %s class surface matches the compat-map column (%d classes)." % (mm, len(expected)))
          PY

  # ── Export strip ─────────────────────────────────────────────────────────────
  # Fails when an export ships a toolkit script, a GDScript extension or
  # res://.mcp.json, whatever lets it through: a change of ours, another export
  # plugin, or an engine change to how export plugins run. Per version it exports
  # the project's data pack with the committed Windows preset in Text and
  # compressed binary-token modes (Text only on 4.2) and asserts on the parsed
  # pack listing; check_export_strip.sh explains the pack export and the listing.
  # A pack export needs no templates, so the Linux runner can export the
  # Windows preset. Launching an exported build stays a manual release check.
  export-strip:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Fuse: the warm-up is capped at 240s and each pack export takes well under
    # a minute — at 15 min the job is hung, not slow.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Export strip (pack export · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        # pinned to v2.4.1 — update tag manually after reviewing changelogs
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      # Written here, never committed, so the tool counts and coverage manifests
      # do not move. The probe must be a direct MCPToolkitExtension subclass with
      # a class_name: that is what the strip removes, read from the class cache.
      - name: Write an extension probe and a dummy .mcp.json
        shell: bash
        run: |
          cat > export_strip_probe.gd <<'GD'
          @tool
          class_name ExportStripProbe
          extends MCPToolkitExtension


          func register(registry: MCPToolkitCommandRegistry, _server: Node) -> void:
              registry.add("probe.ping", _ping, MCPToolkitExtensionOptions.new("Probe ping"))


          func _ping(_params: Dictionary) -> Dictionary:
              return MCPToolkitSuccess.ok({"data": "pong"})
          GD
          printf '%s\n' '{"mcpServers": {}}' > .mcp.json

      # The unit job's class-cache warm-up, which works on every version (4.2.0's
      # --import hangs instead), so the export knows the probe's class.
      - name: Warm the class cache
        shell: bash
        env:
          GODOT_WARM_ONLY: "1"
        run: bash ./scripts/test_framework/run_units_cold.sh

      - name: Export packs and assert the strip
        shell: bash
        env:
          EXPORT_STRIP_OUT: ${{ runner.temp }}/export-strip
          MODES: ${{ matrix.godot-version == '4.2.0' && '0' || '2 0' }}
        run: bash ./scripts/test_framework/check_export_strip.sh res://export_strip_probe.gd $MODES

  # ── Aggregate floor gate ─────────────────────────────────────────────────────
  # "Toolkit floor OK" is the SINGLE name bound as a required check for pull requests
  # (and on the protected branch) — never an individual matrix row. A required
  # check pinned to a matrix leg breaks whenever the matrix is retuned; pinning to
  # this one stable name never does. The Godot jobs skip only when `changes`
  # classified the run as a docs-only pull request; any other skip turns this gate
  # red, so it cannot pass vacuously. It uses `if:` skips, never `paths:` filters,
  # because a `paths:`-skipped required check would deadlock as pending.
  floor-ok:
    name: "Toolkit floor OK"
    needs: [changes, docs-check, gdscript-check, unit-tests, update-flow, release-builds, manifest-diff, export-strip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every floor job succeeded
        env:
          CODE: ${{ needs.changes.outputs.code }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A toolkit floor job failed or was cancelled."
            exit 1
          fi
          if [ "$CODE" != "false" ] && [ "$SKIPPED" = "true" ]; then
            echo "::error::A toolkit floor job was skipped on a run that changes code."
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "Docs-only pull request: the editor-free checks succeeded, the Godot jobs were skipped."
          else
            echo "All toolkit floor jobs succeeded."
          fi

# Cross-version behavioral matrix (toolkit) — opt-in, editor-required.
#
# The static floor (ci.yml) gates every push/PR. This workflow runs the FULL
# two-editor behavioral matrix for a TOOLKIT change — a GDScript-editor tier AND
# a .NET/mono-editor tier — plus the mono-editor UNIT leg, all against the PINNED
# server sibling. Both behavioral tiers launch a real headless Godot editor and
# round-trip the FULL smoke + flows suites through the WS bridge, one job per
# supported minor, via the SHARED language-parameterized composite
# (.github/actions/cross-version-behavioral in the SERVER repo, reached through the
# sibling checkout; language: gdscript | dotnet). The section set is byte-identical
# across both languages AND across both repos, so the tiers cannot drift (iter
# 41n-quater-ter + the "full behavioral matrix in both repos" follow-on). The
# SERVER repo's cross-version.yml runs the SAME full two-editor matrix for its own
# changes against the pinned toolkit — so an opt-in on EITHER repo proves the full
# GDScript+.NET contract for that repo's change.
#
# NOT a merge gate — runs only on explicit opt-in:
#   • [run-cross-version-ci] in the push commit message  (deliberate "run it")
#   • release.yml CALLS this workflow (workflow_call) on a v* tag / dry-run
#     dispatch, and its zip job needs: it — the D13 backstop (never SHIP a
#     cross-version regression) is now an ENFORCED release gate, not a parallel
#     best-effort run
#   • workflow_dispatch                                   (manual)
# No schedule: — versions are explicitly pinned (no drift between pushes) and a
# nightly over-runs a sparse post-release repo (feasibility spike 41n-quater).
# The mono-editor UNIT leg lives HERE (not the server) because the unit suite is
# toolkit code — a toolkit push/tag must re-run it.
#
# Feasibility proven 2026-07-01 (41n-quater Stage-2): a display-less ubuntu-latest
# runner keeps the editor alive and serves the WS round-trip (standard 29/0; mono
# §25 15/0). The smoke/flows harness, the C# fixture, AND the shared composite all
# live in the SERVER repo, so this workflow checks the server out as a sibling and
# invokes the composite from that path (both behavioral tiers). While the repos are
# private the sibling checkout needs a read-only PAT (CROSS_REPO_READ_TOKEN); once
# public the || github.token fallback makes it tokenless. The server checkout is
# PINNED to a recorded revision (env.SIBLING_PIN_SERVER, see below) — no race with
# server main; bump the pin deliberately, with [run-cross-version-ci] on the bump commit.
name: cross-version (toolkit)

# D7: least privilege by default; the sibling checkout uses the read-only PAT
# (CROSS_REPO_READ_TOKEN) while private, github.token once public.
permissions:
  contents: read

on:
  # D13: release.yml calls this workflow so a release GATES on the full behavioral
  # matrix. Under workflow_call the job `if:` gates below evaluate the CALLER's
  # context — a v* tag push satisfies startsWith(github.ref,'refs/tags/v'); a
  # dry-run dispatch satisfies event_name=='workflow_dispatch' — so they need no
  # change. inputs.sibling-ref resolves empty when called -> the pin fallback holds.
  workflow_call:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated Godot versions (informational; matrix is fixed)"
        required: false
      sibling-ref:
        description: "Override the pinned server sibling ref (ad-hoc cross-testing / spike trials)"
        required: false
        default: ""
  push:
    # D13: the v* self-trigger is REMOVED — a release tag now reaches this workflow
    # ONCE, through release.yml's workflow_call, instead of firing a second parallel
    # run. The [run-cross-version-ci] commit-token path (push to main) is unchanged.
    branches: [main]

# SIBLING-PIN(server): deterministic sibling — BOTH behavioral jobs below (gdscript +
# dotnet) test against exactly this server revision, not floating main. This env var is
# the SINGLE bump point: bump it deliberately in a dedicated commit carrying
# [run-cross-version-ci] (the bump IS the tested integration event); override ad-hoc via
# the sibling-ref dispatch input. See Plan/Reference/ci-test-topology.md.
env:
  SIBLING_PIN_SERVER: "d771e11455f9b438a680453e4d8ed638d0d12263"

jobs:
  gdscript-behavioral:
    # Opt-in only: manual dispatch, a v* tag, or the token in the commit message.
    # A plain main push (no token) evaluates this to false → the job shows as
    # "skipped" with zero runner cost.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows) — a leg still running
    # at 30 min is hung (e.g. an editor boot that never serves the port), not slow.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7 # toolkit (self) = the editor/dogfood project

      - uses: actions/checkout@v7 # server = smoke + flows harness + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          # SIBLING-PIN(server): pinned via env.SIBLING_PIN_SERVER (workflow-level env above).
          ref: ${{ inputs.sibling-ref || env.SIBLING_PIN_SERVER }}

      - name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          language: gdscript
          godot-version: ${{ matrix.godot-version }}
          server-dir: server
          project-path: ${{ github.workspace }}
          project-name: "Godot MCP Toolkit"
          # D11: run the 7 dispatch-integration flows on exactly ONE row per repo
          # mirror (GDScript · 4.7.0) — dispatch semantics live in toolkit GDScript +
          # server transport, so project language is irrelevant (GDScript avoids the
          # mono variables) and 4.7.0 is the ceiling. Closes the last editor-required
          # CI gap (FIFO / cancellation / peer-disconnect / scene-lease). Composite
          # inputs are strings, hence the string-valued expression.
          run-dispatch: ${{ matrix.godot-version == '4.7.0' }}

  # Opt-in .NET/mono-editor BEHAVIORAL tier — the .NET mirror hosted HERE so a
  # toolkit opt-in proves the full GDScript+.NET contract for a toolkit change (the
  # addon under test is toolkit code) against the PINNED server sibling. Same shared
  # composite (language: dotnet), byte-identical section set as the server repo's
  # own C# tier. The C# fixture AND the smoke/flows harness live in the SERVER repo,
  # so they ride the sibling checkout; the addon injects from this (toolkit) checkout
  # via TOOLKIT_ADDON_SRC. The .NET tier now runs 4.2.0 too (41n-quater-septies): the
  # shared composite's cold class-cache warm-up ports to dotnet (CWD = the C# fixture;
  # run_units_cold.sh invoked from the pinned server checkout's toolkit sibling).
  # Mono pins mirror the server C# matrix EXACTLY (initial stables — 4.6.0, same as GDScript);
  # TFM tracks the net6->net8 boundary at 4.4 so the editor's on-open build produces
  # an assembly its bundled runtime can load.
  dotnet-behavioral:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows on mono) — a leg still
    # running at 30 min is hung (e.g. an editor boot that never serves the port).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.2.0 (net6.0): 4.2-mono behavioral leg (41n-quater-septies). Its cold
          # class-cache warm-up runs in the shared composite (dotnet path). 4.2 & 4.3
          # are both net6.0 (the net6->net8 TFM boundary is 4.4).
          - godot-version: "4.2.0"
            tfm: "net6.0"
          - godot-version: "4.3.0"
            tfm: "net6.0"
          - godot-version: "4.4.0"
            tfm: "net8.0"
          - godot-version: "4.5.0"
            tfm: "net8.0"
          - godot-version: "4.6.0"
            tfm: "net8.0"
          - godot-version: "4.7.0"
            tfm: "net8.0"
    # Display name: "mono editor" (not ".NET/mono editor") — the shorter label keeps
    # the VARYING Godot version inside the Actions UI's truncation fold, matching the
    # GDScript twin's length (user directive 2026-07-04). Prose/comments still say
    # ".NET/mono" where they describe the editor build.
    name: "Full smoke+flows (mono editor · Godot ${{ matrix.godot-version }} / ${{ matrix.tfm }})"
    steps:
      - uses: actions/checkout@v7 # toolkit (self) = addon source (injected into fixture)

      - uses: actions/checkout@v7 # server = harness + C# fixture + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          # SIBLING-PIN(server): pinned via env.SIBLING_PIN_SERVER (workflow-level env above).
          ref: ${{ inputs.sibling-ref || env.SIBLING_PIN_SERVER }}

      - name: "Full smoke+flows (mono editor · Godot ${{ matrix.godot-version }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          language: dotnet
          godot-version: ${{ matrix.godot-version }}
          tfm: ${{ matrix.tfm }}
          server-dir: server
          project-path: ${{ github.workspace }}/server/test/fixtures/csharp-project
          project-name: "MCP CSharp Fixture"
          toolkit-addon-src: ${{ github.workspace }}/addons/godot_mcp_toolkit

  # Opt-in .NET/mono-editor unit leg — the mono side of the units mirror (R4). The
  # STANDARD-editor units gate merges on the floor (ci.yml, all versions); the
  # heavier mono provisioning (a .NET SDK install) rides this opt-in tier. Same
  # run_units_cold.sh via the shared godot-units composite, use-dotnet: true.
  #
  # D10: trimmed 6 rows -> the 2 boundary FLAVORS. The unit suite is pure GDScript,
  # so a mono row proves only build-flavor boot/scan — a middle row could only catch
  # a three-way interaction (suite × mono flavor × that version) that escapes BOTH
  # its shadows in the same opt-in run: the floor units ×6 (same version+suite,
  # standard flavor) and the dotnet-behavioral tier (same mono editor boot, ×6,
  # untouched). The kept rows are genuinely distinct:
  #   • 4.2.0-mono — the cold-class-cache warm-up × mono interaction
  #     (41n-quater-septies's row; run_units_cold.sh warms it inherently)
  #   • 4.7.0-mono — the ceiling flavor
  # The floor asymmetry (standard units gate merges ×6; mono units are opt-in ×2) is
  # DESIGNED, not an oversight: .NET provisioning per push for a GDScript-only suite
  # is against ecosystem practice (C# floors stay editor-free). Lives HERE (not the
  # server workflow) because the unit suite is toolkit code — a toolkit push/tag
  # must re-run it.
  mono-units:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: a leg finishes in a few minutes — at 15 min it is hung, not slow (mono
    # provisioning adds a couple minutes over the standard floor units).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.7.0"]
    # Display name: "mono editor" for the same truncation-proofing as the behavioral
    # tier above.
    name: "Unit tests (mono editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-units
        with:
          godot-version: ${{ matrix.godot-version }}
          use-dotnet: true

# Cross-version behavioral matrix (toolkit) — opt-in, editor-required.
#
# The static floor (ci.yml) gates every push/PR. This workflow runs the FULL
# two-editor behavioral matrix for a TOOLKIT change — a GDScript-editor tier AND
# a .NET/mono-editor tier — plus the mono-editor UNIT leg, all against the PINNED
# server sibling. Both behavioral tiers launch a real headless Godot editor and
# round-trip the FULL smoke + flows suites through the WS bridge, one job per
# supported minor, via the SHARED language-parameterized composite
# (.github/actions/cross-version-behavioral in the SERVER repo, reached through the
# sibling checkout; language: gdscript | dotnet). The section set is byte-identical
# across both languages AND across both repos, so the tiers cannot drift (iter
# 41n-quater-ter + the "full behavioral matrix in both repos" follow-on). The
# SERVER repo's cross-version.yml runs the SAME full two-editor matrix for its own
# changes against the pinned toolkit — so an opt-in on EITHER repo proves the full
# GDScript+.NET contract for that repo's change.
#
# NOT a merge gate — runs only on explicit opt-in:
#   • [run-cross-version-ci] in the push commit message  (deliberate "run it" — LINUX)
#   • release.yml CALLS this workflow (workflow_call) on a v* tag / dry-run
#     dispatch, and its zip job needs: it — the D13 backstop (never SHIP a
#     cross-version regression) is now an ENFORCED release gate, not a parallel
#     best-effort run
#   • workflow_dispatch                                   (manual)
#
# Cross-platform legs (41n-quater-sexies) — additive, each behind its OWN token so a
# toolkit change is validated on 3 OS × 6 versions × 2 languages = 36 combos:
#   • [run-macos-ci]         -> macOS behavioral (gdscript+dotnet, 4.2-4.7)
#   • [run-windows-ci]       -> Windows behavioral (gdscript+dotnet, 4.2-4.7)
#   • [run-all-platforms-ci] -> the full 36: Linux (above) + macOS + Windows
# The macOS/Windows matrix is computed by the platform-setup job (commit tokens, or the
# workflow_dispatch platforms/versions/languages debug-probe inputs), reusing the SAME
# server-hosted composite via the sibling checkout. A bare/tag/release trigger yields an
# EMPTY non-Linux matrix, so the release gate stays LINUX-ONLY until 42b (macOS 10× /
# Windows 2× billing while private). The "Platform matrix OK" aggregate gate wraps all
# combos — the single name a merge-queue required check binds to at 42b. The editor-free
# install-smoke + Windows unit legs live in the SERVER workflow only (server code).
# No schedule: — versions are explicitly pinned (no drift between pushes) and a
# nightly over-runs a sparse post-release repo (feasibility spike 41n-quater).
# The mono-editor UNIT leg lives HERE (not the server) because the unit suite is
# toolkit code — a toolkit push/tag must re-run it.
#
# Feasibility proven 2026-07-01 (41n-quater Stage-2): a display-less ubuntu-latest
# runner keeps the editor alive and serves the WS round-trip (standard 29/0; mono
# §25 15/0). The smoke/flows harness, the C# fixture, AND the shared composite all
# live in the SERVER repo, so this workflow checks the server out as a sibling and
# invokes the composite from that path (both behavioral tiers). While the repos are
# private the sibling checkout needs a read-only PAT (CROSS_REPO_READ_TOKEN); once
# public the || github.token fallback makes it tokenless. The server checkout is
# PINNED to a recorded revision (env.SIBLING_PIN_SERVER, see below) — no race with
# server main; bump the pin deliberately, with [run-cross-version-ci] on the bump commit.
name: cross-version (toolkit)

# D7: least privilege by default; the sibling checkout uses the read-only PAT
# (CROSS_REPO_READ_TOKEN) while private, github.token once public.
permissions:
  contents: read

on:
  # D13: release.yml calls this workflow so a release GATES on the full behavioral
  # matrix. Under workflow_call the job `if:` gates below evaluate the CALLER's
  # context — a v* tag push satisfies startsWith(github.ref,'refs/tags/v'); a
  # dry-run dispatch satisfies event_name=='workflow_dispatch' — so they need no
  # change. inputs.sibling-ref resolves empty when called -> the pin fallback holds.
  workflow_call:
  workflow_dispatch:
    inputs:
      sibling-ref:
        description: "Override the pinned server sibling ref (ad-hoc cross-testing / spike trials)"
        required: false
        default: ""
      # 41n-quater-sexies D7e — debug-probe targeting for the EXPENSIVE non-Linux
      # matrix. Empty platforms => Linux static legs only (release-dry-run shape). A
      # single {platform,version,language} triple runs one cheap combo instead of the
      # full non-Linux grid (~$0.80 vs ~$9.60). The FINAL confirm is always the full
      # matrix via the commit tokens — a version-gated fix can regress a neighbour.
      # Linux legs run in full on ANY dispatch (cheap; keeps the release gate exact).
      # (`versions` was formerly informational-only; it now filters the non-Linux matrix.)
      platforms:
        description: "Non-Linux legs to run: space/comma list of macos, windows (empty = none)"
        required: false
        default: ""
      versions:
        description: "Godot versions for the non-Linux legs (space/comma; empty = all 4.2.0-4.7.0)"
        required: false
        default: ""
      languages:
        description: "Editor languages for the non-Linux legs: gdscript, dotnet (empty = both)"
        required: false
        default: ""
  push:
    # D13: the v* self-trigger is REMOVED — a release tag now reaches this workflow
    # ONCE, through release.yml's workflow_call, instead of firing a second parallel
    # run. The [run-cross-version-ci] commit-token path (push to main) is unchanged.
    branches: [main]

# SIBLING-PIN(server): deterministic sibling — BOTH behavioral jobs below (gdscript +
# dotnet) test against exactly this server revision, not floating main. This env var is
# the SINGLE bump point: bump it deliberately in a dedicated commit carrying
# [run-cross-version-ci] (the bump IS the tested integration event); override ad-hoc via
# the sibling-ref dispatch input. See Plan/Reference/ci-test-topology.md.
env:
  SIBLING_PIN_SERVER: "654b29f6d672268fbf96d03b0f2b64cbf9c1a4ec"

jobs:
  gdscript-behavioral:
    # Opt-in only: manual dispatch, a v* tag, or the token in the commit message.
    # A plain main push (no token) evaluates this to false → the job shows as
    # "skipped" with zero runner cost. [run-all-platforms-ci] runs it as part of the
    # full 36-combo grid (41n-quater-sexies).
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]') ||
      contains(github.event.head_commit.message, '[run-all-platforms-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows) — a leg still running
    # at 30 min is hung (e.g. an editor boot that never serves the port), not slow.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7 # toolkit (self) = the editor/dogfood project

      - uses: actions/checkout@v7 # server = smoke + flows harness + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          # SIBLING-PIN(server): pinned via env.SIBLING_PIN_SERVER (workflow-level env above).
          ref: ${{ inputs.sibling-ref || env.SIBLING_PIN_SERVER }}

      - name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          language: gdscript
          godot-version: ${{ matrix.godot-version }}
          server-dir: server
          project-path: ${{ github.workspace }}
          project-name: "Godot MCP Toolkit"
          # D11: run the 7 dispatch-integration flows on exactly ONE row per repo
          # mirror (GDScript · 4.7.0) — dispatch semantics live in toolkit GDScript +
          # server transport, so project language is irrelevant (GDScript avoids the
          # mono variables) and 4.7.0 is the ceiling. Closes the last editor-required
          # CI gap (FIFO / cancellation / peer-disconnect / scene-lease). Composite
          # inputs are strings, hence the string-valued expression.
          run-dispatch: ${{ matrix.godot-version == '4.7.0' }}

  # Opt-in .NET/mono-editor BEHAVIORAL tier — the .NET mirror hosted HERE so a
  # toolkit opt-in proves the full GDScript+.NET contract for a toolkit change (the
  # addon under test is toolkit code) against the PINNED server sibling. Same shared
  # composite (language: dotnet), byte-identical section set as the server repo's
  # own C# tier. The C# fixture AND the smoke/flows harness live in the SERVER repo,
  # so they ride the sibling checkout; the addon injects from this (toolkit) checkout
  # via TOOLKIT_ADDON_SRC. The .NET tier now runs 4.2.0 too (41n-quater-septies): the
  # shared composite's cold class-cache warm-up ports to dotnet (CWD = the C# fixture;
  # run_units_cold.sh invoked from the pinned server checkout's toolkit sibling).
  # Mono pins mirror the server C# matrix EXACTLY (initial stables — 4.6.0, same as GDScript);
  # TFM tracks the net6->net8 boundary at 4.4 so the editor's on-open build produces
  # an assembly its bundled runtime can load.
  dotnet-behavioral:
    # [run-all-platforms-ci] runs it as part of the full 36-combo grid (41n-quater-sexies).
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]') ||
      contains(github.event.head_commit.message, '[run-all-platforms-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows on mono) — a leg still
    # running at 30 min is hung (e.g. an editor boot that never serves the port).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.2.0 (net6.0): 4.2-mono behavioral leg (41n-quater-septies). Its cold
          # class-cache warm-up runs in the shared composite (dotnet path). 4.2 & 4.3
          # are both net6.0 (the net6->net8 TFM boundary is 4.4).
          - godot-version: "4.2.0"
            tfm: "net6.0"
          - godot-version: "4.3.0"
            tfm: "net6.0"
          - godot-version: "4.4.0"
            tfm: "net8.0"
          - godot-version: "4.5.0"
            tfm: "net8.0"
          - godot-version: "4.6.0"
            tfm: "net8.0"
          - godot-version: "4.7.0"
            tfm: "net8.0"
    # Display name: "mono editor" (not ".NET/mono editor") — the shorter label keeps
    # the VARYING Godot version inside the Actions UI's truncation fold, matching the
    # GDScript twin's length (user directive 2026-07-04). Prose/comments still say
    # ".NET/mono" where they describe the editor build.
    name: "Full smoke+flows (mono editor · Godot ${{ matrix.godot-version }} / ${{ matrix.tfm }})"
    steps:
      - uses: actions/checkout@v7 # toolkit (self) = addon source (injected into fixture)

      - uses: actions/checkout@v7 # server = harness + C# fixture + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          # SIBLING-PIN(server): pinned via env.SIBLING_PIN_SERVER (workflow-level env above).
          ref: ${{ inputs.sibling-ref || env.SIBLING_PIN_SERVER }}

      - name: "Full smoke+flows (mono editor · Godot ${{ matrix.godot-version }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          language: dotnet
          godot-version: ${{ matrix.godot-version }}
          tfm: ${{ matrix.tfm }}
          server-dir: server
          project-path: ${{ github.workspace }}/server/test/fixtures/csharp-project
          project-name: "MCP CSharp Fixture"
          toolkit-addon-src: ${{ github.workspace }}/addons/godot_mcp_toolkit

  # Opt-in .NET/mono-editor unit leg — the mono side of the units mirror (R4). The
  # STANDARD-editor units gate merges on the floor (ci.yml, all versions); the
  # heavier mono provisioning (a .NET SDK install) rides this opt-in tier. Same
  # run_units_cold.sh via the shared godot-units composite, use-dotnet: true.
  #
  # D10: trimmed 6 rows -> the 2 boundary FLAVORS. The unit suite is pure GDScript,
  # so a mono row proves only build-flavor boot/scan — a middle row could only catch
  # a three-way interaction (suite × mono flavor × that version) that escapes BOTH
  # its shadows in the same opt-in run: the floor units ×6 (same version+suite,
  # standard flavor) and the dotnet-behavioral tier (same mono editor boot, ×6,
  # untouched). The kept rows are genuinely distinct:
  #   • 4.2.0-mono — the cold-class-cache warm-up × mono interaction
  #     (41n-quater-septies's row; run_units_cold.sh warms it inherently)
  #   • 4.7.0-mono — the ceiling flavor
  # The floor asymmetry (standard units gate merges ×6; mono units are opt-in ×2) is
  # DESIGNED, not an oversight: .NET provisioning per push for a GDScript-only suite
  # is against ecosystem practice (C# floors stay editor-free). Lives HERE (not the
  # server workflow) because the unit suite is toolkit code — a toolkit push/tag
  # must re-run it.
  mono-units:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: a leg finishes in a few minutes — at 15 min it is hung, not slow (mono
    # provisioning adds a couple minutes over the standard floor units).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.7.0"]
    # Display name: "mono editor" for the same truncation-proofing as the behavioral
    # tier above.
    name: "Unit tests (mono editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-units
        with:
          godot-version: ${{ matrix.godot-version }}
          use-dotnet: true

  # ═══════════════════════════════════════════════════════════════════════════
  # macOS + Windows platform legs (41n-quater-sexies) — additive, token-gated.
  # The static Linux legs above are the release backstop + [run-cross-version-ci] path.
  # These add the OTHER two desktop OSes so a toolkit change is validated on 3 OS × 6
  # versions × 2 languages = 36 combos, via the SAME shared server-hosted composite
  # (reached through the server sibling checkout; os branch). Opt-in only; an EMPTY
  # matrix on a bare/tag/release trigger keeps the release gate Linux-only until 42b.
  # (mono-units is NOT part of this platform matrix — it stays on [run-cross-version-ci].)
  # ═══════════════════════════════════════════════════════════════════════════

  # Compute the macOS+Windows behavioral matrix from the trigger (commit tokens on a
  # branch push, or the dispatch platforms/versions/languages inputs). Cheap ubuntu job.
  # Repo-agnostic: identical to the server workflow's platform-setup.
  platform-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      platforms: ${{ steps.compute.outputs.platforms }}
    steps:
      - id: compute
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_VERSIONS: ${{ inputs.versions }}
          IN_LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          ALL_VERSIONS="4.2.0 4.3.0 4.4.0 4.5.0 4.6.0 4.7.0"
          ALL_LANGUAGES="gdscript dotnet"
          platforms=""; versions="$ALL_VERSIONS"; languages="$ALL_LANGUAGES"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            platforms="${IN_PLATFORMS:-}"
            [ -n "${IN_VERSIONS:-}" ] && versions="$IN_VERSIONS"
            [ -n "${IN_LANGUAGES:-}" ] && languages="$IN_LANGUAGES"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            case "$COMMIT_MSG" in *"[run-all-platforms-ci]"*) platforms="macos windows" ;; esac
            case "$COMMIT_MSG" in *"[run-macos-ci]"*)   platforms="$platforms macos"   ;; esac
            case "$COMMIT_MSG" in *"[run-windows-ci]"*) platforms="$platforms windows" ;; esac
          fi

          norm() { echo "$1" | tr ',' ' ' | tr 'A-Z' 'a-z' | xargs -n1 2>/dev/null | sort -u | xargs || true; }
          platforms="$(norm "$platforms")"; versions="$(norm "$versions")"; languages="$(norm "$languages")"

          entries=""
          for os_key in $platforms; do
            case "$os_key" in
              macos)   runner="macos-latest";   os_label="macOS" ;;
              windows) runner="windows-latest"; os_label="Windows" ;;
              *)       continue ;;
            esac
            for version in $versions; do
              case "$version" in 4.2*|4.3*) tfm="net6.0" ;; *) tfm="net8.0" ;; esac
              for language in $languages; do
                case "$language" in
                  gdscript) editor_label="GDScript editor"; project_name="Godot MCP Toolkit" ;;
                  dotnet)   editor_label="mono editor";     project_name="MCP CSharp Fixture" ;;
                  *)        continue ;;
                esac
                run_dispatch="false"
                if [ "$language" = "gdscript" ] && [ "$version" = "4.7.0" ]; then run_dispatch="true"; fi
                entry="{\"os\":\"$runner\",\"os_key\":\"$os_key\",\"os_label\":\"$os_label\",\"version\":\"$version\",\"language\":\"$language\",\"editor_label\":\"$editor_label\",\"tfm\":\"$tfm\",\"project_name\":\"$project_name\",\"run_dispatch\":$run_dispatch}"
                if [ -z "$entries" ]; then entries="$entry"; else entries="$entries,$entry"; fi
              done
            done
          done
          matrix="[$entries]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "computed platforms=[$platforms] matrix=$matrix"

  # One job def; os/version/language from platform-setup. runs-on the matrix OS; the
  # shared composite (server sibling) branches on os_key. Skipped (empty matrix) on
  # bare/tag/release. Job timeout is a LAST-RESORT backstop only — the composite's
  # per-step $TIMEOUT_BIN fuses (<=15m) trip first so the always() log dump survives.
  platform-behavioral:
    needs: platform-setup
    if: ${{ needs.platform-setup.outputs.matrix != '' && needs.platform-setup.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platform-setup.outputs.matrix) }}
    name: "Full smoke+flows (${{ matrix.os_label }} ${{ matrix.version }} · ${{ matrix.editor_label }})"
    steps:
      - uses: actions/checkout@v7 # toolkit (self) = editor/dogfood project + addon source

      - uses: actions/checkout@v7 # server = harness + C# fixture + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          ref: ${{ inputs.sibling-ref || env.SIBLING_PIN_SERVER }}

      - name: "Full smoke+flows (${{ matrix.os_label }} ${{ matrix.version }} · ${{ matrix.editor_label }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          os: ${{ matrix.os_key }}
          language: ${{ matrix.language }}
          godot-version: ${{ matrix.version }}
          tfm: ${{ matrix.tfm }}
          server-dir: server
          project-path: ${{ matrix.language == 'dotnet' && format('{0}/server/test/fixtures/csharp-project', github.workspace) || github.workspace }}
          project-name: ${{ matrix.project_name }}
          toolkit-addon-src: ${{ matrix.language == 'dotnet' && format('{0}/addons/godot_mcp_toolkit', github.workspace) || '' }}
          run-dispatch: ${{ matrix.run_dispatch }}

  # ── Aggregate platform gate (41n-quater-sexies D7b/7c) ───────────────────────
  # "Platform matrix OK" is the SINGLE stable name intended to become the SECOND
  # required-check tier (merge-queue-scoped) at 42b — never an individual matrix row.
  # Wraps the toolkit's platform combos: the static Linux behavioral legs + the
  # macOS/Windows behavioral matrix. (The editor-free install-smoke / Windows unit jobs
  # live in the SERVER workflow only; mono-units is not a platform leg.) if: always() +
  # the failure/cancelled test makes a partial run or a bare push report success.
  platform-matrix-ok:
    name: "Platform matrix OK"
    needs:
      [gdscript-behavioral, dotnet-behavioral, platform-setup, platform-behavioral]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every platform job succeeded (or skipped)
        run: |
          result="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$result" = "true" ]; then
            echo "::error::A platform matrix job failed or was cancelled."
            exit 1
          fi
          echo "All platform matrix jobs succeeded (or skipped)."

  # Anti-vacuous release-gate assertion. platform-matrix-ok above correctly treats
  # all-skipped as success (the platform legs are opt-in). But on a v* tag / dry-run
  # dispatch the two Linux BEHAVIORAL jobs are the gate before the release — an
  # all-SKIP there (e.g. a new trigger type that slips past their if: gates) would
  # sail through platform-matrix-ok vacuously. This job runs ONLY when the behavioral
  # gate is meant to run, and requires those jobs to REPORT success (not merely "not
  # failed") — an all-skip goes RED.
  behavioral-gate-ok:
    name: "Behavioral gate OK"
    needs: [gdscript-behavioral, dotnet-behavioral]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert both Linux behavioral jobs succeeded (not skipped)
        run: |
          gd="${{ needs.gdscript-behavioral.result }}"
          dn="${{ needs.dotnet-behavioral.result }}"
          echo "gdscript-behavioral=$gd  dotnet-behavioral=$dn"
          if [ "$gd" != "success" ] || [ "$dn" != "success" ]; then
            echo "::error::Release behavioral gate not satisfied — both Linux behavioral jobs must succeed (got gdscript=$gd dotnet=$dn). An all-skip is a vacuous gate."
            exit 1
          fi
          echo "Behavioral gate satisfied."

# Behavioral cross-version tier (GDScript) — opt-in, editor-required.
#
# The static floor (ci.yml) gates every push/PR. This tier launches a real
# headless Godot editor against the toolkit dogfood and round-trips the FULL
# smoke + flows suites through the WS bridge, one job per supported minor — via
# the SHARED language-parameterized composite that also drives the server's C#
# tier (.github/actions/cross-version-behavioral in the SERVER repo, reached
# through the sibling checkout; language: gdscript). Both tiers run the
# byte-identical section set, so they cannot drift (iter 41n-quater-ter). It is
# NOT a merge gate — it runs only on explicit opt-in:
#   • [run-cross-version-ci] in the push commit message  (deliberate "run it")
#   • a v* release tag                                    (backstop: never SHIP a
#                                                          cross-version regression)
#   • workflow_dispatch                                   (manual)
# No schedule: — versions are explicitly pinned (no drift between pushes) and a
# nightly over-runs a sparse post-release repo (feasibility spike 41n-quater).
# The .NET/mono-editor BEHAVIORAL mirror is the SERVER repo's cross-version.yml — same shared
# composite, identical section set; this workflow hosts the GDScript-editor legs plus the
# mono-editor UNIT leg (the unit suite is toolkit code, so it re-runs on toolkit pushes/tags).
#
# Feasibility proven 2026-07-01 (41n-quater Stage-2): a display-less ubuntu-latest
# runner keeps the editor alive and serves the WS round-trip (standard 29/0).
#
# The smoke/flows harness AND the shared composite live in the SERVER repo, so this
# workflow checks the server out as a sibling and invokes the composite from that
# path. While the repos are private the sibling checkout needs a read-only PAT
# (CROSS_REPO_READ_TOKEN); once public the || github.token fallback makes it tokenless.
name: cross-version (GDScript behavioral)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated Godot versions (informational; matrix is fixed)"
        required: false
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  gdscript-behavioral:
    # Opt-in only: manual dispatch, a v* tag, or the token in the commit message.
    # A plain main push (no token) evaluates this to false → the job shows as
    # "skipped" with zero runner cost.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows) — a leg still running
    # at 30 min is hung (e.g. an editor boot that never serves the port), not slow.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.2.0", "4.3.0", "4.4.0", "4.5.0", "4.6.0", "4.7.0"]
    name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v4 # toolkit (self) = the editor/dogfood project

      - uses: actions/checkout@v4 # server = smoke + flows harness + shared composite
        with:
          repository: NPGameDev/godot-mcp-server
          path: server
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: "Full smoke+flows (GDScript editor · Godot ${{ matrix.godot-version }})"
        uses: ./server/.github/actions/cross-version-behavioral
        with:
          language: gdscript
          godot-version: ${{ matrix.godot-version }}
          server-dir: server
          project-path: ${{ github.workspace }}
          project-name: "Godot MCP Toolkit"

  # Opt-in .NET/mono-editor unit leg — the mono side of the units mirror (R4). The
  # STANDARD-editor units gate merges on the floor (ci.yml, all versions); the
  # heavier mono provisioning (a .NET SDK install) rides this opt-in tier. Same
  # run_units_cold.sh via the shared godot-units composite, use-dotnet: true.
  # 4.2-on-mono is deferred to 41n-quater-septies (untested cold-cache × mono-editor
  # interaction), so this leg is gated 4.3-4.7; septies adds the 4.2 row. Mono pins
  # mirror the server C# matrix exactly (4.6.2, not the standard 4.6.0). Lives
  # HERE (not in the server workflow) because the unit suite is toolkit code —
  # a toolkit push/tag must re-run it.
  mono-units:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: a leg finishes in a few minutes — at 15 min it is hung, not slow (mono
    # provisioning adds a couple minutes over the standard floor units).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.3.0", "4.4.0", "4.5.0", "4.6.2", "4.7.0"]
    name: "Unit tests (.NET/mono editor · Godot ${{ matrix.godot-version }})"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-units
        with:
          godot-version: ${{ matrix.godot-version }}
          use-dotnet: true

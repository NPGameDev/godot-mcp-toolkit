# Classifies a run as code or docs-only, so the editor-provisioning jobs can skip a
# pull request that changes nothing they test. Only a pull request can be docs-only:
# every other trigger (a push to main, a tag, a dispatch, a release's workflow_call,
# a merge-queue run) reports code, so the release gates and the deliberate opt-ins
# always run in full.
#
# Callers gate jobs with `if:`, never with `paths:` filters. A job skipped by `if:`
# reports to the aggregate gate as skipped, which it accepts, while a required check
# a `paths:` filter skips stays pending and blocks the merge. A caller lists the
# classifying job in its aggregate's needs: so a failed classification turns the
# gate red instead of skipping everything silently.
#
# Needs a checkout with fetch-depth: 2. A pull_request run checks out GitHub's merge
# commit, whose first parent is the base branch tip, so HEAD^1..HEAD is exactly
# what merging the PR would change.
name: Classify the change
description: "Outputs code=false for a pull request that only changes *.md files or docs/**, code=true otherwise."
outputs:
  code:
    description: "'false' for a docs-only pull request, 'true' for everything else."
    value: ${{ steps.classify.outputs.code }}
runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        code=true
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # --no-renames lists a rename as its delete and its add, so moving a code
          # file under docs/ still counts as a code change.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          printf 'Changed files:\n%s\n' "$files"
          # No grep -q here: exiting early would kill printf with SIGPIPE, and under
          # pipefail a negated pipeline turns that failure into docs-only.
          code_files="$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/)' || true)"
          if [ -n "$files" ] && [ -z "$code_files" ]; then
            code=false
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "code=$code (event: $EVENT_NAME)"

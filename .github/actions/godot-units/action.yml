name: Godot unit tests (cold class-cache)
description: >
  Provision a Godot editor (standard or .NET/mono) and run the toolkit unit
  suite from a cold script-class cache. Gives every supported version a real
  execution signal — required on 4.2 (whose editor scan aborts on cross-file
  class_name references, so the editor-headless static validator cannot run) and
  idempotent on 4.3+, so the identical run_units_cold.sh runs uniformly on every
  version and under either editor. The caller must check out the repository first.

inputs:
  godot-version:
    description: "Godot version to provision (e.g. 4.2.0)"
    required: false
    default: "4.2.0"
  use-dotnet:
    description: "Provision the .NET/mono editor build (also installs the .NET SDKs)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Godot (Godot ${{ inputs.godot-version }})
      # pinned to v2.4.1 — update tag manually after reviewing changelogs
      uses: chickensoft-games/setup-godot@v2.4.1
      with:
        version: "${{ inputs.godot-version }}"
        use-dotnet: ${{ inputs.use-dotnet }}

    # The .NET/mono editor build needs the .NET runtime/SDKs to launch.
    - name: Setup .NET SDKs (8 + 6, mono editor runtime)
      if: ${{ inputs.use-dotnet == 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          6.0.x

    # An editor-scan boot warms global_script_class_cache.cfg, gated on the
    # cache artifact appearing (a frame-count quit races the threaded scan on
    # slow runner disks; transient class_name errors are summarized and the
    # full warm-up log is dumped only on failure), then the unit runner runs
    # and its exit code gates the job. `godot` is on PATH after setup-godot,
    # so the wrapper defaults GODOT_BIN to it.
    - name: Run unit tests (cold class-cache warm-up)
      shell: bash
      run: bash ./scripts/test_framework/run_units_cold.sh
